name: fitness_metrics
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  get: ^4.6.6
  scaled_app: ^2.3.0
  flutter_svg: ^2.0.10+1
  loader_overlay: ^4.0.1
  flutter_spinkit: ^5.2.1
  pinput: ^5.0.0
  dotted_border: ^2.1.0
  table_calendar: ^3.1.2
  fl_chart: ^0.69.0
  dropdown_button2: ^2.3.9
  flutter_typeahead: ^5.2.0
#  api call
  curl_logger_dio_interceptor: ^1.0.0
  connectivity_plus: ^6.0.4
  get_storage: ^2.1.1
  logger: ^2.4.0
  dio: ^5.6.0
  slide_countdown: ^1.6.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  pull_to_refresh: ^2.0.0
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.1
  syncfusion_flutter_charts: ^26.2.12
  file_picker: ^8.1.2
  youtube_player_flutter: ^8.1.0
  lottie: ^3.1.2
  numberpicker: ^2.1.2
  webview_flutter: ^4.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/delete/
    - assets/lottie/

  fonts:
    - family: LeagueSpartan
      fonts:
        - asset: assets/fonts/LeagueSpartan-Thin.ttf
          weight: 100
        - asset: assets/fonts/LeagueSpartan-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/LeagueSpartan-Light.ttf
          weight: 300
        - asset: assets/fonts/LeagueSpartan-Regular.ttf
          weight: 400
        - asset: assets/fonts/LeagueSpartan-Medium.ttf
          weight: 500
        - asset: assets/fonts/LeagueSpartan-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/LeagueSpartan-Bold.ttf
          weight: 700
        - asset: assets/fonts/LeagueSpartan-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/LeagueSpartan-Black.ttf
          weight: 900

